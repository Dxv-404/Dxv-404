<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Train Poker</title>
<meta name="description" content="Offline No-Limit Texas Hold'em for friends, one phone each, over a hotspot.">
<meta name="theme-color" content="#1b120d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train Poker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><div id="boot" style="font-family:Georgia,serif;color:#f3ead7;background:#1b120d;min-height:100vh;padding:48px 24px;box-sizing:border-box">
<h1 style="font-size:34px;margin:0 0 12px">Train Poker</h1>
<p id="boot-msg" style="font-family:sans-serif;font-size:17px;line-height:1.5;color:#d9cbb0;margin:0">Loading&hellip;</p>
</div></div>
<script>
/* Runs even in old browsers: if the game hasn't started after a few seconds, explain why. */
setTimeout(function () {
  var m = document.getElementById('boot-msg');
  if (m) m.innerHTML = 'This browser can\'t run Train Poker. It looks like Opera Mini or another data-saving browser, which can\'t use the camera or connect phones directly.<br><br><b style="color:#ecd39b">Open this link in Chrome</b> (or Safari on iPhone): train-poker.vercel.app';
}, 4000);
</script>
<button id="info-btn" aria-label="Poker hands and rules"><span aria-hidden="true">i</span></button>
<noscript>Train Poker needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
