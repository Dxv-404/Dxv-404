<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ink Tiger</title>
<script>(function(){var h=location.hash.slice(1);if(h==='calm'||h==='still')document.documentElement.classList.add(h)})()</script>
<style>
@font-face{font-family:'Yuji Syuku';src:url(/tp/fonts/yujisyuku-regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:block}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
</style>
<style id="tg-css">
/* ---- tg: root + motion levels ---- */
.tg-root{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;contain:layout paint;line-height:0}
.tg-root svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.tg-sheen{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.34) 50%,rgba(255,255,255,0) 62%)}
/* paused while off screen / tab hidden */
.tg-off *{animation-play-state:paused!important}
/* calm: no idle loops, entrance is one soft fade.  still: nothing moves. */
:is(.calm,.still) .tg-root *, .tg-root:is(.calm,.still) *{animation:none!important}
@keyframes tg-calm-in{from{opacity:0}to{opacity:1}}
.calm .tg-root.tg-go, .tg-root.calm.tg-go{animation:tg-calm-in .5s ease-out both}
@media (prefers-reduced-motion: reduce){ .tg-root, .tg-root *{animation:none!important} }

/* ---- tg: Ink Tiger ---- */
.tg-root{background:#f2ead8}
.tg-l-back,.tg-l-head,.tg-l-grain{will-change:transform}
.tg-l-grain,.tg-l-fx{pointer-events:none}
.tg-svg *{transform-box:view-box}
.tg-hd{transform-origin:50% 60%}
/* idle: slow breath; eyes smoulder; a blink; whiskers twitch; bamboo sways; a leaf falls */
@keyframes tg-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.013)}}
.tg-hd{animation:tg-breathe 5.2s ease-in-out infinite}
@keyframes tg-glow{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}
.tg-glow{animation:tg-glow 2.8s ease-in-out infinite}
@keyframes tg-blink{0%,93.5%,100%{transform:scaleY(0)}95.5%,97%{transform:scaleY(1)}}
.tg-lid{transform:scaleY(0);animation:tg-blink 6.4s linear infinite}
@keyframes tg-tw{0%,62%,100%{transform:rotate(0)}68%{transform:rotate(var(--a))}75%{transform:rotate(calc(var(--a)*-.7))}83%{transform:rotate(calc(var(--a)*.4))}}
.tg-wh{animation:tg-tw 4.3s var(--d) ease-in-out infinite}
@keyframes tg-sway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(3.2deg)}}
.tg-lf{animation:tg-sway 3.7s ease-in-out infinite}
@keyframes tg-fall{0%,55%{transform:translate(0,0) rotate(0);opacity:0}58%{opacity:1}100%{transform:translate(-190px,330px) rotate(-250deg);opacity:1}}
.tg-fall{opacity:0;animation:tg-fall 9s cubic-bezier(.4,.1,.6,.9) infinite}
/* only in the roar */
.tg-sl,.tg-dp,.tg-fly,.tg-flash,.tg-ring{opacity:0}
.tg-maw{transform:scaleY(0);opacity:0}
/* entrance: the page comes up, ink blooms into the head, the stripes are brushed on one by one, the eyes light, the seal lands */
@keyframes tg-in{from{opacity:0}to{opacity:1}}
@keyframes tg-bloom{0%{clip-path:circle(0% at 50% 62%);opacity:.4}100%{clip-path:circle(80% at 50% 62%);opacity:1}}
@keyframes tg-paint{0%{transform:scale(0);opacity:0}15%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tg-light{0%{opacity:0}60%{opacity:1;filter:brightness(2.2)}100%{opacity:1;filter:none}}
@keyframes tg-stamp{0%{transform:scale(2.1) rotate(-9deg);opacity:0}70%{transform:scale(.94) rotate(0);opacity:1}100%{transform:scale(1);opacity:1}}
.tg-go .tg-l-back{animation:tg-in .35s ease-out backwards}
.tg-go .tg-l-leaf{animation:tg-in .5s .15s ease-out backwards}
.tg-go .tg-l-head{animation:tg-bloom .6s .2s cubic-bezier(.3,.6,.3,1) backwards,tg-breathe 5.2s ease-in-out infinite}
.tg-go .tg-st{animation:tg-paint .26s calc(.55s + var(--i)*.04s) cubic-bezier(.2,.7,.3,1) backwards}
.tg-go .tg-chin{animation:tg-in .3s .55s ease-out backwards}
.tg-go .tg-eye{animation:tg-light .5s 1.45s ease-out backwards}
.tg-go .tg-wh{animation:tg-paint .3s 1.3s ease-out backwards,tg-tw 4.3s 1.6s ease-in-out infinite}
.tg-go .tg-fang{animation:tg-in .3s .6s ease-out backwards}
.tg-go .tg-seal{animation:tg-stamp .28s 1.75s cubic-bezier(.3,1.4,.5,1) backwards}
</style>

    I.tl(I.q('.tg-chin'),T,[[250,{transform:'translateY(0px)'},E],[400,{transform:'translateY(33px)'},'ease-in-out'],[1150,{transform:'translateY(30px)'},'cubic-bezier(.5,0,.3,1)'],[1480,{transform:'translateY(0px)'}]]);
    I.qa('.tg-glow').forEach(function(g){I.tl(g,T,[[200,{transform:'scale(1)',opacity:.8},E],[380,{transform:'scale(1.55)',opacity:1}],[1150,{transform:'scale(1.4)',opacity:1},'ease-in-out'],[1800,{transform:'scale(1)',opacity:.7}]])});
    I.qa('.tg-iris').forEach(function(g){I.tl(g,T,[[200,{transform:'scale(1,1)'},E],[380,{transform:'scale(1.12,.62)'}],[1150,{transform:'scale(1.1,.66)'},'ease-in-out'],[1600,{transform:'scale(1,1)'}]])});
    I.qa('.tg-brow').forEach(function(g){I.tl(g,T,[[200,{transform:'rotate(0deg) translateY(0px)'},E],[380,{transform:'rotate(7deg) translateY(4px)'}],[1150,{transform:'rotate(6deg) translateY(3.5px)'},'ease-in-out'],[1600,{transform:'rotate(0deg) translateY(0px)'}]])});
    I.qa('.tg-wh').forEach(function(w){I.tl(w,T,[[250,{transform:'rotate(0deg)'},E],[400,{transform:'rotate(-15deg)'},'ease-in-out'],[560,{transform:'rotate(-9deg)'},'ease-in-out'],[720,{transform:'rotate(-13deg)'},'ease-in-out'],[1150,{transform:'rotate(-10deg)'},'ease-in-out'],[1700,{transform:'rotate(0deg)'}]])});
    // claw strokes
    I.qa('.tg-sl').forEach(function(s){
      var t=430+(+s.dataset.i)*85;
      I.tl(s,T,[[0,{transform:'scale(0)',opacity:0}],[t,{transform:'scale(0)',opacity:1},'cubic-bezier(.1,.8,.1,1)'],[t+170,{transform:'scale(1)',opacity:1}],[1500,{transform:'scale(1)',opacity:1},'ease-in'],[2150,{transform:'scale(1.015)',opacity:0}]]);

    I.qa('.tg-dp').forEach(function(d,i){

      I.tl(d,T,[[0,{transform:'translate(0px,0px) scale(.3)',opacity:0}],[t,{transform:'translate(0px,0px) scale(.3)',opacity:1},'cubic-bezier(.1,.7,.2,1)'],
        [t+520,{transform:'translate('+d.dataset.dx+'px,'+(-d.dataset.dy)+'px) scale(1)',opacity:1},'ease-in'],[t+1050,{transform:'translate('+d.dataset.dx*1.08+'px,'+(-d.dataset.dy+38)+'px) scale(.6)',opacity:0}]]);

    I.qa('.tg-lf').forEach(function(l){

    });

      I.tl(l,T,[[0,{transform:'translate(0px,0px) rotate(0deg)',opacity:0}],[t,{transform:'translate(0px,0px) rotate(0deg)',opacity:1},'cubic-bezier(.2,.5,.5,1)'],
        [t+1300,{transform:'translate('+(-230-i*22)+'px,'+(150+i*36)+'px) rotate('+(-300-i*70)+'deg)',opacity:1}],[t+1500,{transform:'translate('+(-250-i*22)+'px,'+(175+i*36)+'px) rotate('+(-340-i*70)+'deg)',opacity:0}]]);

    I.tl(I.root,T,[[380,{transform:'translate(0,0)'}],[420,{transform:'translate(-1.6%,.9%)'}],[470,{transform:'translate(1.3%,-.8%)'}],[520,{transform:'translate(-1%,.5%)'}],[580,{transform:'translate(.7%,-.4%)'}],[650,{transform:'translate(-.4%,.2%)'}],[730,{transform:'translate(0,0)'}]]);

    I.tl(I.q('.tg-ring'),T,[[0,{opacity:0,transform:'scale(1)'}],[1540,{opacity:.9,transform:'scale(1)'},'ease-out'],[2200,{opacity:0,transform:'scale(2.3)'}]]);

};

var all=[];
function make(root){
  var I={root:root,anims:[],run:true,vis:true,started:false,timer:0};
  I.q=function(s){return root.querySelector(s)};
  I.qa=function(s){return Array.prototype.slice.call(root.querySelectorAll(s))};
  I.level=function(){
    if((RM&&RM.matches)||root.closest('.still'))return 'still';
    return root.closest('.calm')?'calm':'full';
  };
  // Web Animations wrapper: remembered so a replay can cancel it
  I.anim=function(el,kf,o){
    if(!el||!el.animate)return null;
    var a=el.animate(kf,o);I.anims.push(a);if(!I.run)a.pause();return a;
  };
  // timeline helper: fr=[[ms,{props},easing?],...] on a shared clock of T ms
  I.tl=function(el,T,fr){
    var kf=fr.map(function(f){var k={offset:Math.max(0,Math.min(1,f[0]/T))};for(var p in f[1])k[p]=f[1][p];if(f[2])k.easing=f[2];return k});
    if(kf[0].offset>0){var a={};for(var p in kf[0])a[p]=kf[0][p];a.offset=0;delete a.easing;kf.unshift(a)}
    var l=kf[kf.length-1];if(l.offset<1){var b={};for(var p2 in l)b[p2]=l[p2];b.offset=1;kf.push(b)}
    return I.anim(el,kf,{duration:T,fill:'none'});
  };
  I.stop=function(){
    I.anims.forEach(function(a){try{a.cancel()}catch(e){}});I.anims=[];
    clearTimeout(I.timer);if(H.reset)H.reset(I);
  };
  return I;
}
function play(I){
  var lv=I.level();I.stop();
  if(lv==='still')return;
  if(lv==='calm'){                                   // brief highlight instead of the move
    I.anim(I.q('.'+P+'-sheen'),[{transform:'translateX(-110%)',opacity:1},{transform:'translateX(110%)',opacity:1}],{duration:650,easing:'ease-in-out'});
    return;
  }
  H.move(I);
}
function enter(I){
  var lv=I.level();I.stop();I.started=true;
  I.root.classList.remove(P+'-go');void I.root.offsetWidth;
  if(lv!=='still')I.root.classList.add(P+'-go');
  var own=H.enter?H.enter(I,lv):false;               // a hook may run the move itself
  if(lv==='full'&&!MANUAL&&!own)I.timer=setTimeout(function(){play(I)},AUTO);
}
function setRun(I){
  var on=I.vis&&!document.hidden;
  if(on===I.run)return;I.run=on;
  I.root.classList.toggle(P+'-off',!on);
  I.anims.forEach(function(a){try{if(on){if(a.playState==='paused')a.play()}else if(a.playState==='running')a.pause()}catch(e){}});
  if(H.run)H.run(I,on);
  if(on&&!I.started&&!MANUAL)enter(I);
}
function init(root){
  if(root.__tg)return root.__tg;
  var I=root.__tg=make(root);all.push(I);
  root.addEventListener('click',function(){play(I)});
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){I.vis=es[es.length-1].isIntersecting;setRun(I)},{threshold:.02}).observe(root);
  }
  if(H.init)H.init(I);
  if(document.hidden){I.run=false;root.classList.add(P+'-off');if(H.run)H.run(I,false)}
  else if(!MANUAL)enter(I);
  return I;
}
document.addEventListener('visibilitychange',function(){all.forEach(setRun)});
function each(fn,el){all.forEach(function(I){if(!el||I.root===el||el.contains(I.root))fn(I)})}
// public API
window.tgInit=function(el){[].forEach.call((el||document).querySelectorAll('.'+P+'-root'),init)}; // call after injecting markup
window.tgPlay=function(el){each(play,el)};      // signature move (or calm highlight)
window.tgEnter=function(el){each(enter,el)};    // replay entrance; call after changing the motion level
window.tgDbg=all;
window.tgInit();
})();
</script>
<script>
// a tap plays the move (the poster does that itself); the app is told, for its records
document.addEventListener('click',function(){try{parent.postMessage({t:'tp-poster',id:"ink-ink-tiger",what:'play'},location.origin)}catch(e){}});
// the app can ask for the move too (the card's own tap target, a key press)
addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.t==='tp-poster-play'&&window.tgPlay)window.tgPlay()});
</script>
