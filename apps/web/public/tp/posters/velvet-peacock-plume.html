<script>(function(){var h=location.hash.slice(1);if(h==='calm'||h==='still')document.documentElement.classList.add(h)})()</script>
<style>
@font-face{font-family:'Yuji Syuku';src:url(/tp/fonts/yujisyuku-regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:block}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
</style>
<style id="pk-css">
/* ---- pk: root + motion levels ---- */
.pk-root{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;contain:layout paint;line-height:0}
.pk-root svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.pk-sheen{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.34) 50%,rgba(255,255,255,0) 62%)}
/* paused while off screen / tab hidden */
.pk-off *{animation-play-state:paused!important}
/* calm: no idle loops, entrance is one soft fade.  still: nothing moves. */
:is(.calm,.still) .pk-root *, .pk-root:is(.calm,.still) *{animation:none!important}
@keyframes pk-calm-in{from{opacity:0}to{opacity:1}}
.calm .pk-root.pk-go, .pk-root.calm.pk-go{animation:pk-calm-in .5s ease-out both}
@media (prefers-reduced-motion: reduce){ .pk-root, .pk-root *{animation:none!important} }

/* ---- pk: Velvet Peacock ---- */
.pk-root{background:#1a0510}
.pk-svg *{transform-box:view-box}
/* idle: the fan breathes: the whole fan layer spreads a hair wider and settles (compositor-only, no repaint) */
.pk-fanclip{position:absolute;left:6%;top:4.5%;width:88%;height:91%;overflow:hidden}
@keyframes pk-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.022,.99)}}
.pk-root .pk-fan{transform-origin:50% 82.42%;will-change:transform;animation:pk-breathe 4.4s ease-in-out infinite}
.pk-l-back{will-change:transform}
/* idle: crest stalks bobble on their own springs */
@keyframes pk-bob{0%,100%{transform:rotate(-3deg)}22%{transform:rotate(4.5deg)}41%{transform:rotate(-1.5deg)}58%{transform:rotate(2.5deg)}76%{transform:rotate(-.5deg)}}
.pk-cs{animation:pk-bob 2.9s ease-in-out infinite}
/* idle: now and then a glint ripples across the eyes */
@keyframes pk-shine{0%,100%{opacity:0}3%{opacity:.85}8%{opacity:0}}
.pk-shine{opacity:0;animation:pk-shine 7.5s linear infinite}
/* entrance: the scene comes up; the tail itself opens via the move (JS) */
@keyframes pk-in{from{opacity:0}to{opacity:1}}
.pk-go.pk-root{animation:pk-in .3s ease-out backwards}
</style>

    var B=OPEN+7*STEP;
    I.tl(I.q('.pk-body'),T,[[0,{transform:first?'translateY(4px) scale(1,.975)':'translateY(0px) scale(1,1)'},'ease-in-out'],
      [first?1:SHUT,{transform:'translateY(4px) scale(1,.975)'}],[OPEN,{transform:'translateY(4px) scale(1,.975)'},'cubic-bezier(.2,.8,.2,1)'],
      [B+150,{transform:'translateY(-3px) scale(1,1.03)'},'ease-in-out'],[B+520,{transform:'translateY(0px) scale(1,1)'}]]);
    I.tl(I.q('.pk-crest'),T,[[0,{transform:first?'rotate(-22deg) scale(.8)':'rotate(0deg) scale(1)'},'ease-in'],
      [first?1:SHUT,{transform:'rotate(-22deg) scale(.8)'}],[OPEN+60,{transform:'rotate(-22deg) scale(.8)'},'cubic-bezier(.2,.9,.2,1)'],
      [OPEN+260,{transform:'rotate(12deg) scale(1.15)'},'ease-in-out'],[OPEN+440,{transform:'rotate(-5deg) scale(.98)'},'ease-in-out'],
      [OPEN+620,{transform:'rotate(2deg) scale(1)'},'ease-in-out'],[OPEN+800,{transform:'rotate(0deg) scale(1)'}]]);
    // sunburst turns exactly one ray (15deg) with the snap, so it ends where it began
    I.tl(I.q('.pk-rays'),T,[[OPEN,{transform:'rotate(0deg)',opacity:.22},'cubic-bezier(.2,.8,.2,1)'],[B+200,{transform:'rotate(11deg)',opacity:.5},'ease-out'],[B+900,{transform:'rotate(15deg)',opacity:.22}]]);
    I.tl(I.q('.pk-arcs'),T,[[B,{transform:'scale(1)',opacity:.5},'cubic-bezier(.2,.8,.2,1)'],[B+180,{transform:'scale(1.035)',opacity:1},'ease-in-out'],[B+700,{transform:'scale(1)',opacity:.5}]]);
    // shimmer: light runs across every eye in sequence, left to right
    var SH=B+330;
    I.qa('.pk-eye').forEach(function(e){
      var t=SH+(+e.dataset.i)*46;
      I.tl(e,T,[[t,{transform:'scale(1)'},'cubic-bezier(.2,.8,.2,1)'],[t+110,{transform:'scale(1.24)'},'ease-in-out'],[t+420,{transform:'scale(1)'}]]);
      I.tl(e.querySelector('.pk-shine'),T,[[t-1,{opacity:0}],[t+90,{opacity:1}],[t+200,{opacity:.75}],[t+460,{opacity:0}]]);
    });
  },
  enter:function(I,lv){if(lv!=='full')return false;H.move(I,true);return true}
};

var all=[];
function make(root){
  var I={root:root,anims:[],run:true,vis:true,started:false,timer:0};
  I.q=function(s){return root.querySelector(s)};
  I.qa=function(s){return Array.prototype.slice.call(root.querySelectorAll(s))};
  I.level=function(){
    if((RM&&RM.matches)||root.closest('.still'))return 'still';
    return root.closest('.calm')?'calm':'full';
  };
  // Web Animations wrapper: remembered so a replay can cancel it
  I.anim=function(el,kf,o){
    if(!el||!el.animate)return null;
    var a=el.animate(kf,o);I.anims.push(a);if(!I.run)a.pause();return a;
  };
  // timeline helper: fr=[[ms,{props},easing?],...] on a shared clock of T ms
  I.tl=function(el,T,fr){
    var kf=fr.map(function(f){var k={offset:Math.max(0,Math.min(1,f[0]/T))};for(var p in f[1])k[p]=f[1][p];if(f[2])k.easing=f[2];return k});
    if(kf[0].offset>0){var a={};for(var p in kf[0])a[p]=kf[0][p];a.offset=0;delete a.easing;kf.unshift(a)}
    var l=kf[kf.length-1];if(l.offset<1){var b={};for(var p2 in l)b[p2]=l[p2];b.offset=1;kf.push(b)}
    return I.anim(el,kf,{duration:T,fill:'none'});
  };
  I.stop=function(){
    I.anims.forEach(function(a){try{a.cancel()}catch(e){}});I.anims=[];
    clearTimeout(I.timer);if(H.reset)H.reset(I);
  };
  return I;
}
function play(I){
  var lv=I.level();I.stop();
  if(lv==='still')return;
  if(lv==='calm'){                                   // brief highlight instead of the move
    I.anim(I.q('.'+P+'-sheen'),[{transform:'translateX(-110%)',opacity:1},{transform:'translateX(110%)',opacity:1}],{duration:650,easing:'ease-in-out'});
    return;
  }
  H.move(I);
}
function enter(I){
  var lv=I.level();I.stop();I.started=true;
  I.root.classList.remove(P+'-go');void I.root.offsetWidth;
  if(lv!=='still')I.root.classList.add(P+'-go');
  var own=H.enter?H.enter(I,lv):false;               // a hook may run the move itself
  if(lv==='full'&&!MANUAL&&!own)I.timer=setTimeout(function(){play(I)},AUTO);
}
function setRun(I){
  var on=I.vis&&!document.hidden;
  if(on===I.run)return;I.run=on;
  I.root.classList.toggle(P+'-off',!on);
  I.anims.forEach(function(a){try{if(on){if(a.playState==='paused')a.play()}else if(a.playState==='running')a.pause()}catch(e){}});
  if(H.run)H.run(I,on);
  if(on&&!I.started&&!MANUAL)enter(I);
}
function init(root){
  if(root.__pk)return root.__pk;
  var I=root.__pk=make(root);all.push(I);
  root.addEventListener('click',function(){play(I)});
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){I.vis=es[es.length-1].isIntersecting;setRun(I)},{threshold:.02}).observe(root);
  }
  if(H.init)H.init(I);
  if(document.hidden){I.run=false;root.classList.add(P+'-off');if(H.run)H.run(I,false)}
  else if(!MANUAL)enter(I);
  return I;
}
document.addEventListener('visibilitychange',function(){all.forEach(setRun)});
function each(fn,el){all.forEach(function(I){if(!el||I.root===el||el.contains(I.root))fn(I)})}
// public API
window.pkInit=function(el){[].forEach.call((el||document).querySelectorAll('.'+P+'-root'),init)}; // call after injecting markup
window.pkPlay=function(el){each(play,el)};      // signature move (or calm highlight)
window.pkEnter=function(el){each(enter,el)};    // replay entrance; call after changing the motion level
window.pkDbg=all;
window.pkInit();
})();
</script>
<script>
// a tap plays the move (the poster does that itself); the app is told, for its records
document.addEventListener('click',function(){try{parent.postMessage({t:'tp-poster',id:"velvet-peacock-plume",what:'play'},location.origin)}catch(e){}});
// the app can ask for the move too (the card's own tap target, a key press)
addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.t==='tp-poster-play'&&window.pkPlay)window.pkPlay()});
</script>
