<title>Ink Sensei</title>
<script>(function(){var h=location.hash.slice(1);if(h==='calm'||h==='still')document.documentElement.classList.add(h)})()</script>
<style>
@font-face{font-family:'Yuji Syuku';src:url(/tp/fonts/yujisyuku-regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:block}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
</style>
<style id="sn-css">
/* ---- sn: root + motion levels ---- */
.sn-root{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;contain:layout paint;line-height:0}
.sn-root svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.sn-sheen{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.34) 50%,rgba(255,255,255,0) 62%)}
/* paused while off screen / tab hidden */
.sn-off *{animation-play-state:paused!important}
/* calm: no idle loops, entrance is one soft fade.  still: nothing moves. */
:is(.calm,.still) .sn-root *, .sn-root:is(.calm,.still) *{animation:none!important}
@keyframes sn-calm-in{from{opacity:0}to{opacity:1}}
.calm .sn-root.sn-go, .sn-root.calm.sn-go{animation:sn-calm-in .5s ease-out both}
@media (prefers-reduced-motion: reduce){ .sn-root, .sn-root *{animation:none!important} }

/* ---- sn: Ink Sensei ---- */
.sn-root{background:#f2ead8}
.sn-l-back,.sn-l-fig,.sn-l-grain{will-change:transform}        /* own compositor layers: filters rasterise once */
.sn-l-grain,.sn-l-cover{pointer-events:none}
.sn-l-fx *{transform-box:view-box}
/* idle: every brush segment flutters about its own joint; the lag between joints makes a travelling wave */
@keyframes sn-flut{0%{transform:rotate(calc(var(--a)*-1))}28%{transform:rotate(var(--a))}47%{transform:rotate(calc(var(--a)*-.35))}68%{transform:rotate(calc(var(--a)*.7))}100%{transform:rotate(calc(var(--a)*-1))}}
.sn-seg{animation:sn-flut 1s ease-in-out infinite}
/* idle: wind streaks drift through and fade */
@keyframes sn-drift{0%{transform:translateX(-46px);opacity:0}25%{opacity:.26}70%{opacity:.2}100%{transform:translateX(70px);opacity:0}}
.sn-streak{opacity:.22;animation:sn-drift 4s linear infinite}
/* idle: the chip spiral turns slowly round the fingertips */
@keyframes sn-orbit{to{transform:rotate(360deg)}}
.sn-orbit{animation:sn-orbit 22s linear infinite}
/* move-only pieces are invisible at rest */
.sn-rush,.sn-ray,.sn-splat,.sn-drop,.sn-sealring{opacity:0}
.sn-band{opacity:0}
/* entrance: sun brushed in band by band, then the figure inks in, seal lands */
@keyframes sn-sweep{0%{transform:translateX(0);opacity:1}100%{transform:translateX(250px);opacity:1}}
.sn-go .sn-band{animation:sn-sweep .46s cubic-bezier(.5,0,.3,1) backwards}
@keyframes sn-inkin{0%{opacity:0;transform:translateX(9px)}100%{opacity:1;transform:none}}
.sn-go .sn-l-fig{animation:sn-inkin .42s .5s cubic-bezier(.2,.7,.2,1) backwards}
.sn-go .sn-l-fx{animation:sn-inkin .42s .56s cubic-bezier(.2,.7,.2,1) backwards}
</style>

  I.stop=function(){
    I.anims.forEach(function(a){try{a.cancel()}catch(e){}});I.anims=[];
    clearTimeout(I.timer);if(H.reset)H.reset(I);
  };
  return I;
}
function play(I){
  var lv=I.level();I.stop();
  if(lv==='still')return;
  if(lv==='calm'){                                   // brief highlight instead of the move
    I.anim(I.q('.'+P+'-sheen'),[{transform:'translateX(-110%)',opacity:1},{transform:'translateX(110%)',opacity:1}],{duration:650,easing:'ease-in-out'});
    return;
  }
  H.move(I);
}
function enter(I){
  var lv=I.level();I.stop();I.started=true;
  I.root.classList.remove(P+'-go');void I.root.offsetWidth;
  if(lv!=='still')I.root.classList.add(P+'-go');
  var own=H.enter?H.enter(I,lv):false;               // a hook may run the move itself
  if(lv==='full'&&!MANUAL&&!own)I.timer=setTimeout(function(){play(I)},AUTO);
}
function setRun(I){
  var on=I.vis&&!document.hidden;
  if(on===I.run)return;I.run=on;
  I.root.classList.toggle(P+'-off',!on);
  I.anims.forEach(function(a){try{if(on){if(a.playState==='paused')a.play()}else if(a.playState==='running')a.pause()}catch(e){}});
  if(H.run)H.run(I,on);
  if(on&&!I.started&&!MANUAL)enter(I);
}
function init(root){
  if(root.__sn)return root.__sn;
  var I=root.__sn=make(root);all.push(I);
  root.addEventListener('click',function(){play(I)});
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){I.vis=es[es.length-1].isIntersecting;setRun(I)},{threshold:.02}).observe(root);
  }
  if(H.init)H.init(I);
  if(document.hidden){I.run=false;root.classList.add(P+'-off');if(H.run)H.run(I,false)}
  else if(!MANUAL)enter(I);
  return I;
}
document.addEventListener('visibilitychange',function(){all.forEach(setRun)});
function each(fn,el){all.forEach(function(I){if(!el||I.root===el||el.contains(I.root))fn(I)})}
// public API
window.snInit=function(el){[].forEach.call((el||document).querySelectorAll('.'+P+'-root'),init)}; // call after injecting markup
window.snPlay=function(el){each(play,el)};      // signature move (or calm highlight)
window.snEnter=function(el){each(enter,el)};    // replay entrance; call after changing the motion level
window.snDbg=all;
window.snInit();
})();
</script>
<script>
// a tap plays the move (the poster does that itself); the app is told, for its records
document.addEventListener('click',function(){try{parent.postMessage({t:'tp-poster',id:"ink-sensei",what:'play'},location.origin)}catch(e){}});
// the app can ask for the move too (the card's own tap target, a key press)
addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.t==='tp-poster-play'&&window.snPlay)window.snPlay()});
</script>
