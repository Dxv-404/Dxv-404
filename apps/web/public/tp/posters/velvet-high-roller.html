<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The High Roller</title>
<script>(function(){var h=location.hash.slice(1);if(h==='calm'||h==='still')document.documentElement.classList.add(h)})()</script>
<style>
@font-face{font-family:'Yuji Syuku';src:url(/tp/fonts/yujisyuku-regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:block}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
</style>
<style id="hr-css">
/* ---- hr: root + motion levels ---- */
.hr-root{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;contain:layout paint;line-height:0}
.hr-root svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.hr-sheen{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.34) 50%,rgba(255,255,255,0) 62%)}
/* paused while off screen / tab hidden */
.hr-off *{animation-play-state:paused!important}
/* calm: no idle loops, entrance is one soft fade.  still: nothing moves. */
:is(.calm,.still) .hr-root *, .hr-root:is(.calm,.still) *{animation:none!important}
@keyframes hr-calm-in{from{opacity:0}to{opacity:1}}
.calm .hr-root.hr-go, .hr-root.calm.hr-go{animation:hr-calm-in .5s ease-out both}
@media (prefers-reduced-motion: reduce){ .hr-root, .hr-root *{animation:none!important} }

/* ---- hr: The High Roller ---- */
.hr-root{background:#12070b;container-type:inline-size}
.hr-svg *{transform-box:view-box}
.hr-clip{position:absolute;left:6%;top:4.5%;width:88%;height:91%;overflow:hidden}
.hr-clip .hr-in{position:absolute;left:-6.818%;top:-4.945%;width:113.636%;height:109.89%}
.hr-in,.hr-l-rays,.hr-l-halo{transform-origin:50% 44%}
.hr-l-rays,.hr-l-halo,.hr-l-fig{will-change:transform}
.hr-l-fx,.hr-l-front,.hr-dice{pointer-events:none}
/* idle: the sunburst and the wheel turn against each other */
@keyframes hr-turn{to{transform:rotate(360deg)}}
.hr-l-rays{animation:hr-turn 90s linear infinite}
.hr-l-halo{animation:hr-turn 46s linear infinite reverse}
/* idle: he breathes; light crosses the shades; dust rises; things twinkle */
@keyframes hr-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012,1.016)}}
.hr-l-fig{transform-origin:50% 100%;animation:hr-breathe 5.6s ease-in-out infinite}
@keyframes hr-glint{0%,68%{transform:translateX(0)}86%,100%{transform:translateX(120px)}}
.hr-glint{animation:hr-glint 5.2s ease-in-out infinite}
@keyframes hr-mote{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}80%{opacity:.5}100%{transform:translate(var(--x),-300px);opacity:0}}
.hr-mote{opacity:0;animation:hr-mote 5s linear infinite}
@keyframes hr-tw{0%,70%,100%{transform:scale(0) rotate(0)}80%{transform:scale(1) rotate(40deg)}90%{transform:scale(.3) rotate(80deg)}}
.hr-tw{transform:scale(0);animation:hr-tw 4.4s ease-in-out infinite}
.hr-grin,.hr-ring,.hr-spark,.hr-toss{opacity:0}
/* the dice */
.hr-dice{position:absolute;left:0;top:0;width:100%;height:100%;--u:calc(100cqw/300);--h:calc(18*var(--u));perspective:calc(520*var(--u))}
.hr-dw{position:absolute;width:calc(36*var(--u));height:calc(36*var(--u))}
.hr-dw,.hr-bob,.hr-die{transform-style:preserve-3d}
.hr-bob,.hr-die{position:absolute;left:0;top:0;width:100%;height:100%}
@keyframes hr-bob{0%,100%{transform:translateY(-7%)}50%{transform:translateY(9%)}}
.hr-bob{animation:hr-bob 3.4s ease-in-out infinite}
@keyframes hr-tumble{from{transform:rotateX(-24deg) rotateY(32deg)}to{transform:rotateX(336deg) rotateY(392deg)}}
.hr-die{transform:rotateX(-24deg) rotateY(32deg);animation:hr-tumble 9s linear infinite}
.hr-die i{position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;border-radius:15%;border:calc(1.1*var(--u)) solid #e9cf96;backface-visibility:hidden}
/* entrance: the field opens, the wheel spins up, he rises, the stacks land, the dice drop in */
@keyframes hr-in{from{opacity:0}to{opacity:1}}
@keyframes hr-open{0%{transform:scale(.2) rotate(-70deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes hr-wheel{0%{transform:scale(.3) rotate(-200deg);opacity:0}70%{transform:scale(1.06) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes hr-rise{0%{transform:translateY(16%);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes hr-land{0%{transform:translateY(-320px);opacity:0}20%{opacity:1}72%{transform:translateY(0)}84%{transform:translateY(-7px)}100%{transform:translateY(0);opacity:1}}
@keyframes hr-drop{0%{transform:translateY(-420%) scale(.6);opacity:0}30%{opacity:1}70%{transform:translateY(12%) scale(1.04)}100%{transform:translateY(0) scale(1);opacity:1}}
.hr-go.hr-root{animation:hr-in .3s ease-out backwards}
.hr-go .hr-in-rays{animation:hr-open .7s .05s cubic-bezier(.2,.8,.2,1) backwards}
.hr-go .hr-in-halo{animation:hr-wheel .8s .25s cubic-bezier(.2,.8,.2,1) backwards}
.hr-go .hr-l-fig{animation:hr-rise .55s .45s cubic-bezier(.2,.8,.2,1) backwards,hr-breathe 5.6s 1s ease-in-out infinite}
.hr-go .hr-smirk{animation:hr-in .3s .7s ease-out backwards}
.hr-go .hr-s1{animation:hr-land .5s .75s cubic-bezier(.4,0,.6,1) backwards}
.hr-go .hr-s3{animation:hr-land .5s .85s cubic-bezier(.4,0,.6,1) backwards}
.hr-go .hr-s2{animation:hr-land .45s .98s cubic-bezier(.4,0,.6,1) backwards}
.hr-go .hr-s4{animation:hr-land .45s 1.08s cubic-bezier(.4,0,.6,1) backwards}
.hr-go .hr-dw0{animation:hr-drop .6s 1.15s cubic-bezier(.3,.7,.3,1) backwards}
.hr-go .hr-dw1{animation:hr-drop .6s 1.3s cubic-bezier(.3,.7,.3,1) backwards}
</style>

<script id="hr-js">
(function(){
'use strict';
var P='hr', AUTO=2300;
var RM=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
var MANUAL=/manual/.test(location.hash);           // test harness: no automatic start
// The High Roller: the throw. Both dice leave their hover, arc up over his head spinning hard, and come
// down in front of his chest on double six: a ring of gold, sparks, chips thrown up off the rail, a grin.
// Then they lift back to where they were turning.
var H={
  move:function(I){
    var T=3300, LAND=980, HOLD=2250, U=function(n){return (n/36*100).toFixed(1)+'%'};
    var dws=I.qa('.hr-dw'), LANDXY=[[98-36,312-96],[168-228,318-72]];
    I.qa('.hr-die').forEach(function(d,i){
      var dur=+d.dataset.dur, dir=+d.dataset.dir, p=0;
      try{var ca=d.getAnimations().filter(function(a){return a.animationName==='hr-tumble'})[0];if(ca)p=ca.effect.getComputedTiming().progress||0}catch(e){}
      if(dir<0)p=1-p;                                       // progress along the forward keyframes
      var p2=p+dir*T/dur;                                   // where the idle tumble will be when the move ends
      var ang=function(q){return [-24+360*q,32+360*q]}, a0=ang(p), a1=ang(p2);
      var k=dir>0?3:-3, LX=-20+360*k, LY=(i?-24:22)+360*k;  // three full turns, then six up
      var endk=Math.round((LX-a1[0])/360)+dir;              // and a turn on the way back
      var R=function(x,y){return 'rotateX('+x.toFixed(1)+'deg) rotateY('+y.toFixed(1)+'deg)'};
      I.tl(d,T,[[0,{transform:R(a0[0],a0[1])},'cubic-bezier(.3,0,.5,1)'],[LAND,{transform:R(LX,LY)}],[HOLD,{transform:R(LX,LY)},'cubic-bezier(.5,0,.4,1)'],[T,{transform:R(a1[0]+360*endk,a1[1]+360*endk)}]]);
      var w=dws[i], x=LANDXY[i][0], y=LANDXY[i][1], t0=i*70;
      var tr=function(fx,fy,s){return 'translate('+U(x*fx)+','+U(fy)+') scale('+s+')'};
      I.tl(w,T,[[0,{transform:'translate(0%,0%) scale(1)'},'cubic-bezier(.3,0,.7,1)'],[130+t0,{transform:'translate(0%,14%) scale(.94)'},'cubic-bezier(.1,.7,.4,1)'],
        [520+t0,{transform:tr(.45,-70-i*14,1.25)},'cubic-bezier(.5,0,.9,.5)'],[LAND,{transform:tr(1,y,1.42)},'cubic-bezier(.2,.8,.4,1)'],
        [LAND+110,{transform:tr(1,y-16,1.42)},'cubic-bezier(.6,0,.9,.6)'],[LAND+220,{transform:tr(1,y,1.42)}],[HOLD,{transform:tr(1,y,1.42)},'cubic-bezier(.5,0,.3,1)'],[T,{transform:'translate(0%,0%) scale(1)'}]]);
    });
    // the landing
    I.qa('.hr-ring').forEach(function(r,i){I.tl(r,T,[[0,{transform:'scale(.3)',opacity:0}],[LAND+i*90,{transform:'scale(.3)',opacity:1},'cubic-bezier(.1,.7,.2,1)'],[LAND+620+i*90,{transform:'scale('+(3.1+i)+')',opacity:0}]])});
    I.qa('.hr-spark').forEach(function(s){I.tl(s,T,[[0,{transform:'scale(.2)',opacity:0}],[LAND,{transform:'scale(.2)',opacity:1},'cubic-bezier(.1,.8,.2,1)'],[LAND+330,{transform:'scale(1.25)',opacity:1},'ease-in'],[LAND+640,{transform:'scale(1.5)',opacity:0}]])});
    I.qa('.hr-toss').forEach(function(c){
      var dx=+c.dataset.dx, h=+c.dataset.h, t=LAND+20+(+c.dataset.i)*22, up=420+h, s=(dx>0?1:-1)*(360+h*2);
      I.tl(c,T,[[0,{transform:'translate(0px,0px) rotate(0deg)',opacity:0}],[t,{transform:'translate(0px,0px) rotate(0deg)',opacity:1},'cubic-bezier(.2,.7,.4,1)'],
        [t+up*.5,{transform:'translate('+dx*.6+'px,'+(-h)+'px) rotate('+s*.5+'deg)',opacity:1},'cubic-bezier(.6,0,.9,.5)'],[t+up,{transform:'translate('+dx+'px,40px) rotate('+s+'deg)',opacity:1}],[t+up+1,{transform:'translate('+dx+'px,40px)',opacity:0}]]);
    });
    I.qa('.hr-stack').forEach(function(s,i){I.tl(s,T,[[LAND,{transform:'translateY(0px)'},'cubic-bezier(.2,.8,.3,1)'],[LAND+90,{transform:'translateY(-9px)'},'cubic-bezier(.6,0,.8,.5)'],[LAND+200+i*14,{transform:'translateY(0px)'}]])});
    // he likes it
    I.tl(I.q('.hr-smirk'),T,[[0,{opacity:1}],[LAND+60,{opacity:1}],[LAND+140,{opacity:0}],[HOLD+200,{opacity:0}],[HOLD+380,{opacity:1}]]);
    I.tl(I.q('.hr-grin'),T,[[0,{opacity:0}],[LAND+60,{opacity:0}],[LAND+140,{opacity:1}],[HOLD+200,{opacity:1}],[HOLD+380,{opacity:0}]]);
    I.tl(I.q('.hr-glint'),T,[[0,{transform:'translateX(0px)'}],[LAND+120,{transform:'translateX(0px)'},'ease-in-out'],[LAND+560,{transform:'translateX(120px)'}],[LAND+561,{transform:'translateX(0px)'}],[LAND+700,{transform:'translateX(0px)'},'ease-in-out'],[LAND+1100,{transform:'translateX(120px)'}]]);
    I.tl(I.q('.hr-l-fig'),T,[[0,{transform:'scale(1) translateY(0%)'},'ease-in-out'],[300,{transform:'scale(1.02) translateY(-.6%)'},'ease-in-out'],[LAND,{transform:'scale(1) translateY(0%)'},'cubic-bezier(.2,.8,.3,1)'],[LAND+160,{transform:'scale(1.03) translateY(0%)'},'ease-in-out'],[LAND+700,{transform:'scale(1) translateY(0%)'}]]);
    I.qa('.hr-in').forEach(function(l,i){I.tl(l,T,[[LAND,{transform:'scale(1)',filter:'brightness(1)'},'cubic-bezier(.1,.8,.2,1)'],[LAND+170,{transform:'scale('+(i?1.09:1.04)+')',filter:'brightness(1.7)'},'ease-in-out'],[LAND+900,{transform:'scale(1)',filter:'brightness(1)'}]])});
  }
};

var all=[];
function make(root){
  var I={root:root,anims:[],run:true,vis:true,started:false,timer:0};
  I.q=function(s){return root.querySelector(s)};
  I.qa=function(s){return Array.prototype.slice.call(root.querySelectorAll(s))};
  I.level=function(){
    if((RM&&RM.matches)||root.closest('.still'))return 'still';
    return root.closest('.calm')?'calm':'full';
  };
  // Web Animations wrapper: remembered so a replay can cancel it
  I.anim=function(el,kf,o){
    if(!el||!el.animate)return null;
    var a=el.animate(kf,o);I.anims.push(a);if(!I.run)a.pause();return a;
  };
  // timeline helper: fr=[[ms,{props},easing?],...] on a shared clock of T ms
  I.tl=function(el,T,fr){
    var kf=fr.map(function(f){var k={offset:Math.max(0,Math.min(1,f[0]/T))};for(var p in f[1])k[p]=f[1][p];if(f[2])k.easing=f[2];return k});
    if(kf[0].offset>0){var a={};for(var p in kf[0])a[p]=kf[0][p];a.offset=0;delete a.easing;kf.unshift(a)}
    var l=kf[kf.length-1];if(l.offset<1){var b={};for(var p2 in l)b[p2]=l[p2];b.offset=1;kf.push(b)}
    return I.anim(el,kf,{duration:T,fill:'none'});
  };
  I.stop=function(){
    I.anims.forEach(function(a){try{a.cancel()}catch(e){}});I.anims=[];
    clearTimeout(I.timer);if(H.reset)H.reset(I);
  };
  return I;
}
function play(I){
  var lv=I.level();I.stop();
  if(lv==='still')return;
  if(lv==='calm'){                                   // brief highlight instead of the move
    I.anim(I.q('.'+P+'-sheen'),[{transform:'translateX(-110%)',opacity:1},{transform:'translateX(110%)',opacity:1}],{duration:650,easing:'ease-in-out'});
    return;
  }
  H.move(I);
}
function enter(I){
  var lv=I.level();I.stop();I.started=true;
  I.root.classList.remove(P+'-go');void I.root.offsetWidth;
  if(lv!=='still')I.root.classList.add(P+'-go');
  var own=H.enter?H.enter(I,lv):false;               // a hook may run the move itself
  if(lv==='full'&&!MANUAL&&!own)I.timer=setTimeout(function(){play(I)},AUTO);
}
function setRun(I){
  var on=I.vis&&!document.hidden;
  if(on===I.run)return;I.run=on;
  I.root.classList.toggle(P+'-off',!on);
  I.anims.forEach(function(a){try{if(on){if(a.playState==='paused')a.play()}else if(a.playState==='running')a.pause()}catch(e){}});
  if(H.run)H.run(I,on);
  if(on&&!I.started&&!MANUAL)enter(I);
}
function init(root){
  if(root.__hr)return root.__hr;
  var I=root.__hr=make(root);all.push(I);
  root.addEventListener('click',function(){play(I)});
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){I.vis=es[es.length-1].isIntersecting;setRun(I)},{threshold:.02}).observe(root);
  }
  if(H.init)H.init(I);
  if(document.hidden){I.run=false;root.classList.add(P+'-off');if(H.run)H.run(I,false)}
  else if(!MANUAL)enter(I);
  return I;
}
document.addEventListener('visibilitychange',function(){all.forEach(setRun)});
function each(fn,el){all.forEach(function(I){if(!el||I.root===el||el.contains(I.root))fn(I)})}
// public API
window.hrInit=function(el){[].forEach.call((el||document).querySelectorAll('.'+P+'-root'),init)}; // call after injecting markup
window.hrPlay=function(el){each(play,el)};      // signature move (or calm highlight)
window.hrEnter=function(el){each(enter,el)};    // replay entrance; call after changing the motion level
window.hrDbg=all;
window.hrInit();
})();
</script>
<script>
// a tap plays the move (the poster does that itself); the app is told, for its records
document.addEventListener('click',function(){try{parent.postMessage({t:'tp-poster',id:"velvet-high-roller",what:'play'},location.origin)}catch(e){}});
// the app can ask for the move too (the card's own tap target, a key press)
addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.t==='tp-poster-play'&&window.hrPlay)window.hrPlay()});
</script>
