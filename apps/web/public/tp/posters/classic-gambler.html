<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classic Gambler</title>
<script>(function(){var h=location.hash.slice(1);if(h==='calm'||h==='still')document.documentElement.classList.add(h)})()</script>
<style>
@font-face{font-family:'Yuji Syuku';src:url(/tp/fonts/yujisyuku-regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:block}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
</style>
<style id="gm-css">
/* ---- gm: root + motion levels ---- */
.gm-root{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;contain:layout paint;line-height:0}
.gm-root svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.gm-sheen{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.34) 50%,rgba(255,255,255,0) 62%)}
/* paused while off screen / tab hidden */
.gm-off *{animation-play-state:paused!important}
/* calm: no idle loops, entrance is one soft fade.  still: nothing moves. */
:is(.calm,.still) .gm-root *, .gm-root:is(.calm,.still) *{animation:none!important}
@keyframes gm-calm-in{from{opacity:0}to{opacity:1}}
.calm .gm-root.gm-go, .gm-root.calm.gm-go{animation:gm-calm-in .5s ease-out both}
@media (prefers-reduced-motion: reduce){ .gm-root, .gm-root *{animation:none!important} }

/* ---- gm: Classic Gambler ---- */
.gm-root{background:#16050a}
.gm-svg *{transform-box:view-box}
.gm-l-back,.gm-l-smoke,.gm-l-main,.gm-l-sweep{will-change:transform}   /* separate compositor layers */
.gm-l-smoke,.gm-l-sweep{pointer-events:none}
/* idle: ember breathes like a slow drag and lights the jaw with it */
@keyframes gm-ember{0%,100%{transform:scale(.84);opacity:.72}14%{transform:scale(1.3);opacity:1}26%{transform:scale(1.12);opacity:.92}52%{transform:scale(.8);opacity:.66}70%{transform:scale(1.02);opacity:.84}}
@keyframes gm-jaw{0%,100%{opacity:.1}14%{opacity:.5}26%{opacity:.36}52%{opacity:.06}70%{opacity:.24}}
.gm-ember{animation:gm-ember 3.1s ease-in-out infinite}
.gm-jaw{opacity:.24;animation:gm-jaw 3.1s ease-in-out infinite}
.gm-jawflare,.gm-ring,.gm-catch,.gm-fly,.gm-spill{opacity:0}
/* idle: smoke puffs break off the top of the ribbon */
@keyframes gm-puff{0%{transform:translate(0,10px) scale(.4);opacity:0}25%{opacity:.75}100%{transform:translate(7px,-22px) scale(1.7);opacity:0}}
.gm-puff{opacity:0;animation:gm-puff 2.6s ease-out infinite}
.gm-puff2{animation-delay:-1.3s;animation-duration:3.1s}
/* idle: the eyes glint now and then */
@keyframes gm-glint{0%,84%,100%{opacity:0}87%{opacity:1}90%{opacity:.15}93%{opacity:.8}97%{opacity:0}}
@keyframes gm-star{0%,85%,100%{transform:scale(0) rotate(0deg);opacity:0}88%{transform:scale(1) rotate(30deg);opacity:1}95%{transform:scale(0) rotate(80deg);opacity:0}}
.gm-glint{opacity:0;animation:gm-glint 5.6s linear infinite}
.gm-star{opacity:0;animation:gm-star 5.6s linear infinite}
/* idle: a slow light sweep catches the gold frame */
@keyframes gm-sweep{0%{transform:translateX(0)}42%,100%{transform:translateX(560px)}}
.gm-sweepbar{animation:gm-sweep 6.5s ease-in-out infinite}
/* entrance: frame draws itself, scene comes up out of the dark, eyes and ember ignite */
@keyframes gm-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes gm-scene{from{opacity:0;transform:scale(1.07)}to{opacity:1;transform:none}}
@keyframes gm-ignite{0%{opacity:0}30%{opacity:1}45%{opacity:.2}60%{opacity:1}75%{opacity:.5}100%{opacity:1}}
.gm-go .gm-arch{stroke-dasharray:1;animation:gm-draw .85s cubic-bezier(.5,0,.2,1) backwards}
.gm-go .gm-scene{animation:gm-scene .7s .1s cubic-bezier(.2,.7,.2,1) backwards}
.gm-go .gm-eyes{animation:gm-ignite .42s .8s linear backwards}
.gm-go .gm-ember-in{animation:gm-ignite .5s 1s linear backwards}
</style>

  run:function(I,on){H.smil(I,on&&I.level()==='full')}
};
// test-harness hook (only used with #manual)
window.gmSeek=function(ph,t){[].forEach.call(document.querySelectorAll('.gm-svg'),function(s){s.pauseAnimations();s.setCurrentTime(((ph==='sig'?6000:0)+t)/1000)})};

var all=[];
function make(root){
  var I={root:root,anims:[],run:true,vis:true,started:false,timer:0};
  I.q=function(s){return root.querySelector(s)};
  I.qa=function(s){return Array.prototype.slice.call(root.querySelectorAll(s))};
  I.level=function(){
    if((RM&&RM.matches)||root.closest('.still'))return 'still';
    return root.closest('.calm')?'calm':'full';
  };
  // Web Animations wrapper: remembered so a replay can cancel it
  I.anim=function(el,kf,o){
    if(!el||!el.animate)return null;
    var a=el.animate(kf,o);I.anims.push(a);if(!I.run)a.pause();return a;
  };
  // timeline helper: fr=[[ms,{props},easing?],...] on a shared clock of T ms
  I.tl=function(el,T,fr){
    var kf=fr.map(function(f){var k={offset:Math.max(0,Math.min(1,f[0]/T))};for(var p in f[1])k[p]=f[1][p];if(f[2])k.easing=f[2];return k});
    if(kf[0].offset>0){var a={};for(var p in kf[0])a[p]=kf[0][p];a.offset=0;delete a.easing;kf.unshift(a)}
    var l=kf[kf.length-1];if(l.offset<1){var b={};for(var p2 in l)b[p2]=l[p2];b.offset=1;kf.push(b)}
    return I.anim(el,kf,{duration:T,fill:'none'});
  };
  I.stop=function(){
    I.anims.forEach(function(a){try{a.cancel()}catch(e){}});I.anims=[];
    clearTimeout(I.timer);if(H.reset)H.reset(I);
  };
  return I;
}
function play(I){
  var lv=I.level();I.stop();
  if(lv==='still')return;
  if(lv==='calm'){                                   // brief highlight instead of the move
    I.anim(I.q('.'+P+'-sheen'),[{transform:'translateX(-110%)',opacity:1},{transform:'translateX(110%)',opacity:1}],{duration:650,easing:'ease-in-out'});
    return;
  }
  H.move(I);
}
function enter(I){
  var lv=I.level();I.stop();I.started=true;
  I.root.classList.remove(P+'-go');void I.root.offsetWidth;
  if(lv!=='still')I.root.classList.add(P+'-go');
  var own=H.enter?H.enter(I,lv):false;               // a hook may run the move itself
  if(lv==='full'&&!MANUAL&&!own)I.timer=setTimeout(function(){play(I)},AUTO);
}
function setRun(I){
  var on=I.vis&&!document.hidden;
  if(on===I.run)return;I.run=on;
  I.root.classList.toggle(P+'-off',!on);
  I.anims.forEach(function(a){try{if(on){if(a.playState==='paused')a.play()}else if(a.playState==='running')a.pause()}catch(e){}});
  if(H.run)H.run(I,on);
  if(on&&!I.started&&!MANUAL)enter(I);
}
function init(root){
  if(root.__gm)return root.__gm;
  var I=root.__gm=make(root);all.push(I);
  root.addEventListener('click',function(){play(I)});
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){I.vis=es[es.length-1].isIntersecting;setRun(I)},{threshold:.02}).observe(root);
  }
  if(H.init)H.init(I);
  if(document.hidden){I.run=false;root.classList.add(P+'-off');if(H.run)H.run(I,false)}
  else if(!MANUAL)enter(I);
  return I;
}
document.addEventListener('visibilitychange',function(){all.forEach(setRun)});
function each(fn,el){all.forEach(function(I){if(!el||I.root===el||el.contains(I.root))fn(I)})}
// public API
window.gmInit=function(el){[].forEach.call((el||document).querySelectorAll('.'+P+'-root'),init)}; // call after injecting markup
window.gmPlay=function(el){each(play,el)};      // signature move (or calm highlight)
window.gmEnter=function(el){each(enter,el)};    // replay entrance; call after changing the motion level
window.gmDbg=all;
window.gmInit();
})();
</script>
<script>
// a tap plays the move (the poster does that itself); the app is told, for its records
document.addEventListener('click',function(){try{parent.postMessage({t:'tp-poster',id:"classic-gambler",what:'play'},location.origin)}catch(e){}});
// the app can ask for the move too (the card's own tap target, a key press)
addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.t==='tp-poster-play'&&window.gmPlay)window.gmPlay()});
</script>
