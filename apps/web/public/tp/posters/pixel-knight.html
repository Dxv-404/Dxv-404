@font-face{font-family:'Yuji Syuku';src:url(/tp/fonts/yujisyuku-regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:block}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}

<style id="kn-css">
/* ---- kn: root + motion levels ---- */
.kn-root{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;contain:layout paint;line-height:0}
.kn-root svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.kn-sheen{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.34) 50%,rgba(255,255,255,0) 62%)}
/* paused while off screen / tab hidden */
.kn-off *{animation-play-state:paused!important}
/* calm: no idle loops, entrance is one soft fade.  still: nothing moves. */
:is(.calm,.still) .kn-root *, .kn-root:is(.calm,.still) *{animation:none!important}
@keyframes kn-calm-in{from{opacity:0}to{opacity:1}}
.calm .kn-root.kn-go, .kn-root.calm.kn-go{animation:kn-calm-in .5s ease-out both}
@media (prefers-reduced-motion: reduce){ .kn-root, .kn-root *{animation:none!important} }

/* ---- kn: Pixel Knight (stepped frames; the JS stepper only toggles classes/attributes) ---- */
.kn-root{background:#0d0a18}
.kn-svg{image-rendering:pixelated}
.kn-f,.kn-o,.kn-star2,.kn-mote{display:none}
.kn-f.kn-on,.kn-o.kn-on,.kn-mote.kn-on,.kn-star.kn-on .kn-star2{display:inline}
</style>

    for(c=0;c<5;c++){if(i===1+2*c)x.push('c'+c+'w');else if(i>1+2*c)x.push('c'+c+(i>=11&&i%2?'g':''))}
    if(i>=11)x.push(i===11?'crownw':'crown');
    s.push([(i>>1)%2?'up2':'up1',{x:x,sh:i>=12?[i%2?1:-1,0]:null}]);
  }
  s.push(['up2',{x:ALL.concat(['a0','f5','halo2','hot','crown'])}],['smear',{x:ALL.concat(['halo2','crown'])}]);
  var SH=[[0,3],[1,-2],[-1,2],[1,-1],[-1,1],[0,-1],[0,1]];
  for(i=0;i<9;i++){
    x=['s'+i,'crownd'];if(i<6)x.push('b'+i);if(i<7)x.push('hotp');if(i<3)x.push('halo2','cb'+i);if(i===2||i===4)x.push('hot');
    s.push([i<2?'slamsil':i<5?'slam':i<8?'settle':'crouch',{flash:i===0?1:0,dy:i<2?1:0,x:x,sh:SH[i]}]);
  }
  for(i=0;i<10;i++){x=['e'+i];if(i<6||i===7)x.push(i<2?'crownd':'crown');s.push([i<2?'crouch':['i0','i0','i1','i1','i2','i2','i1','i1'][i-2],{x:x}])}
  return s;
})();
var ENT=[[null,{dark:1}],[null,{dark:.66}],[null,{dark:.33}],['i1',{dy:-34}],['i2',{dy:-16}],['i1',{dy:-4}],
  ['slamsil',{dy:1,flash:1,sh:[0,2]}],['slam',{dy:1,x:['s0'],sh:[0,-1]}],['slam',{x:['s1'],sh:[0,1]}],['settle',{x:['s2']}],['settle',{x:['s3']}],['crouch',{x:['s4']}]];
var IDLE=['i0','i0','i1','i1','i2','i2','i1','i1'];
var MX=[6,13,19,30,36,42];
function knShow(I,frame,o,n){
  o=o||{};var S=I.kn,xs=o.x||[];
  S.frames.forEach(function(f){f.classList.toggle('kn-on',f.dataset.f===frame)});
  S.sprite.setAttribute('transform',o.dy?'translate(0 '+o.dy+')':'');
  S.scene.setAttribute('transform',o.sh?'translate('+o.sh[0]+' '+o.sh[1]+')':'');
  S.flash.classList.toggle('kn-on',!!o.flash);
  S.dark.classList.toggle('kn-on',!!o.dark);S.dark.setAttribute('opacity',o.dark||0);
  S.gl.forEach(function(g){g.classList.toggle('kn-on',o.glint!==undefined&&+g.dataset.i===o.glint)});
  S.spark.forEach(function(g){g.classList.toggle('kn-on',o.spark!==undefined&&+g.dataset.i===o.spark)});
  S.xs.forEach(function(g){g.classList.toggle('kn-on',xs.indexOf(g.dataset.x)>=0)});
  S.visor.classList.toggle('kn-on',!!o.dim);
  S.stars.forEach(function(st,i){st.classList.toggle('kn-on',n!==undefined&&((n+i*7)%29)<3)});
  // fireflies drifting up (only while it runs)
  S.motes.forEach(function(m,i){
    if(n===undefined||o.dark){m.classList.remove('kn-on');return}
    var p=(n*(i%3+1)*.3+i*11)%48;
    m.setAttribute('x',MX[i]+Math.round(Math.sin((n+i*9)/7)*1.5));m.setAttribute('y',56-Math.floor(p));
    m.classList.toggle('kn-on',p<42&&((n+i)%6)!==0);
  });
}
function knRender(I){
  var S=I.kn,n=S.n,m=S.mode;
  if(m==='ent'&&n>=ENT.length){m=S.mode='idle';n=S.n=0}
  if(m==='sig'&&n>=SIG.length){m=S.mode='idle';n=S.n=0}
  if(m==='ent')knShow(I,ENT[n][0],ENT[n][1],n);
  else if(m==='sig')knShow(I,SIG[n][0],SIG[n][1],S.t);
  else{var t=S.t,x=(t%36)<18?['halo']:[],k=t%190;if(k<5)x.push('ss'+k);k=(t%70)-44;if(k>=0&&k<8)x.push('pg'+k);
    knShow(I,IDLE[n%IDLE.length],{dim:(n%37)===9||(n%37)===11||(n%53)===30,x:x},t)}
}
function knLoop(I){
  var S=I.kn;cancelAnimationFrame(S.raf);S.last=0;
  if(!I.run||I.level()!=='full'||S.manual)return;
  S.raf=requestAnimationFrame(function step(ts){
    if(!S.last)S.last=ts;
    if(I.level()!=='full'){H.reset(I);return}                 // level changed under us: rest
    if(ts-S.last>=1000/FPS){S.last+=Math.max(1,Math.floor((ts-S.last)/(1000/FPS)))*(1000/FPS);S.n++;S.t++;knRender(I)}
    S.raf=requestAnimationFrame(step);
  });
}
var H={
  init:function(I){
    I.kn={n:0,t:0,mode:'idle',raf:0,frames:I.qa('.kn-f'),sprite:I.q('.kn-sprite'),flash:I.q('.kn-flash'),dark:I.q('.kn-dark'),
      gl:I.qa('.kn-gl'),spark:I.qa('.kn-spark'),visor:I.q('.kn-visor'),stars:I.qa('.kn-star'),xs:I.qa('.kn-x'),scene:I.q('.kn-scene'),motes:I.qa('.kn-mote')};
  },
  reset:function(I){var S=I.kn;cancelAnimationFrame(S.raf);S.mode='idle';S.n=0;knShow(I,'i0',{})},   // resting frame
  enter:function(I,lv){var S=I.kn;if(lv!=='full')return;S.mode='ent';S.n=0;knRender(I);knLoop(I)},
  move:function(I){var S=I.kn;S.mode='sig';S.n=0;knRender(I);knLoop(I)},
  run:function(I){knLoop(I)}
};
// test-harness hook (only used with #manual)
window.knSeek=function(ph,t){window.knDbg.forEach(function(I){var S=I.kn;S.manual=1;cancelAnimationFrame(S.raf);
  S.mode=ph==='ent'?'ent':ph;S.n=Math.floor(t/(1000/FPS));S.t=S.n+40;if(ph==='idle')S.n=S.n%8+S.n-S.n%8;knRender(I)})};

var all=[];
function make(root){
  var I={root:root,anims:[],run:true,vis:true,started:false,timer:0};
  I.q=function(s){return root.querySelector(s)};
  I.qa=function(s){return Array.prototype.slice.call(root.querySelectorAll(s))};
  I.level=function(){
    if((RM&&RM.matches)||root.closest('.still'))return 'still';
    return root.closest('.calm')?'calm':'full';
  };
  // Web Animations wrapper: remembered so a replay can cancel it
  I.anim=function(el,kf,o){
    if(!el||!el.animate)return null;
    var a=el.animate(kf,o);I.anims.push(a);if(!I.run)a.pause();return a;
  };
  // timeline helper: fr=[[ms,{props},easing?],...] on a shared clock of T ms
  I.tl=function(el,T,fr){
    var kf=fr.map(function(f){var k={offset:Math.max(0,Math.min(1,f[0]/T))};for(var p in f[1])k[p]=f[1][p];if(f[2])k.easing=f[2];return k});
    if(kf[0].offset>0){var a={};for(var p in kf[0])a[p]=kf[0][p];a.offset=0;delete a.easing;kf.unshift(a)}
    var l=kf[kf.length-1];if(l.offset<1){var b={};for(var p2 in l)b[p2]=l[p2];b.offset=1;kf.push(b)}
    return I.anim(el,kf,{duration:T,fill:'none'});
  };
  I.stop=function(){
    I.anims.forEach(function(a){try{a.cancel()}catch(e){}});I.anims=[];
    clearTimeout(I.timer);if(H.reset)H.reset(I);
  };
  return I;
}
function play(I){
  var lv=I.level();I.stop();
  if(lv==='still')return;
  if(lv==='calm'){                                   // brief highlight instead of the move
    I.anim(I.q('.'+P+'-sheen'),[{transform:'translateX(-110%)',opacity:1},{transform:'translateX(110%)',opacity:1}],{duration:650,easing:'ease-in-out'});
    return;
  }
  H.move(I);
}
function enter(I){
  var lv=I.level();I.stop();I.started=true;
  I.root.classList.remove(P+'-go');void I.root.offsetWidth;
  if(lv!=='still')I.root.classList.add(P+'-go');
  var own=H.enter?H.enter(I,lv):false;               // a hook may run the move itself
  if(lv==='full'&&!MANUAL&&!own)I.timer=setTimeout(function(){play(I)},AUTO);
}
function setRun(I){
  var on=I.vis&&!document.hidden;
  if(on===I.run)return;I.run=on;
  I.root.classList.toggle(P+'-off',!on);
  I.anims.forEach(function(a){try{if(on){if(a.playState==='paused')a.play()}else if(a.playState==='running')a.pause()}catch(e){}});
  if(H.run)H.run(I,on);
  if(on&&!I.started&&!MANUAL)enter(I);
}
function init(root){
  if(root.__kn)return root.__kn;
  var I=root.__kn=make(root);all.push(I);
  root.addEventListener('click',function(){play(I)});
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){I.vis=es[es.length-1].isIntersecting;setRun(I)},{threshold:.02}).observe(root);
  }
  if(H.init)H.init(I);
  if(document.hidden){I.run=false;root.classList.add(P+'-off');if(H.run)H.run(I,false)}
  else if(!MANUAL)enter(I);
  return I;
}
document.addEventListener('visibilitychange',function(){all.forEach(setRun)});
function each(fn,el){all.forEach(function(I){if(!el||I.root===el||el.contains(I.root))fn(I)})}
// public API
window.knInit=function(el){[].forEach.call((el||document).querySelectorAll('.'+P+'-root'),init)}; // call after injecting markup
window.knPlay=function(el){each(play,el)};      // signature move (or calm highlight)
window.knEnter=function(el){each(enter,el)};    // replay entrance; call after changing the motion level
window.knDbg=all;
window.knInit();
})();
</script>
<script>
// a tap plays the move (the poster does that itself); the app is told, for its records
document.addEventListener('click',function(){try{parent.postMessage({t:'tp-poster',id:"pixel-knight",what:'play'},location.origin)}catch(e){}});
// the app can ask for the move too (the card's own tap target, a key press)
addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.t==='tp-poster-play'&&window.knPlay)window.knPlay()});
</script>
