@font-face{font-family:'Yuji Syuku';src:url(/tp/fonts/yujisyuku-regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:block}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}

<style id="kn-css">
/* ---- kn: root + motion levels ---- */
.kn-root{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;contain:layout paint;line-height:0}
.kn-root svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.kn-sheen{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.34) 50%,rgba(255,255,255,0) 62%)}
/* paused while off screen / tab hidden */
.kn-off *{animation-play-state:paused!important}
/* calm: no idle loops, entrance is one soft fade.  still: nothing moves. */
:is(.calm,.still) .kn-root *, .kn-root:is(.calm,.still) *{animation:none!important}
@keyframes kn-calm-in{from{opacity:0}to{opacity:1}}
.calm .kn-root.kn-go, .kn-root.calm.kn-go{animation:kn-calm-in .5s ease-out both}
@media (prefers-reduced-motion: reduce){ .kn-root, .kn-root *{animation:none!important} }

/* ---- kn: Pixel Knight (stepped frames; the JS stepper only toggles classes/attributes) ---- */
.kn-root{background:#0d0a18}
.kn-svg{image-rendering:pixelated}
.kn-f,.kn-o,.kn-star2{display:none}
.kn-f.kn-on,.kn-o.kn-on,.kn-star.kn-on .kn-star2{display:inline}
</style>

// Pixel Knight: a 12 fps frame stepper. No easing, no tweening: each tick shows one sprite
// frame plus a few overlay pixels, like a game sprite sheet.
var FPS=12;
// signature move, one entry per tick: [frame, {flash, glint, spark, dy}]
var SIG=(function(){
  var s=[['crouch'],['crouch'],['rip',{flash:1}],['pull'],['smear'],['up0',{spark:0}]],i;
  for(i=0;i<16;i++)s.push([(i>>1)%2?'up2':'up1',{glint:i,spark:i===0?1:i===1?2:-1}]);
  s.push(['up2'],['smear'],['slam',{dy:1}],['settle'],['crouch']);
  return s;
})();
var ENT=[[null,{dark:1}],[null,{dark:.66}],[null,{dark:.33}],['i1',{dy:-34}],['i2',{dy:-16}],['i1',{dy:-4}],['slam',{dy:1}],['settle'],['crouch']];
var IDLE=['i0','i0','i1','i1','i2','i2','i1','i1'];
function knShow(I,frame,o,n){
  o=o||{};var S=I.kn;
  S.frames.forEach(function(f){f.classList.toggle('kn-on',f.dataset.f===frame)});
  S.sprite.setAttribute('transform',o.dy?'translate(0 '+o.dy+')':'');
  S.flash.classList.toggle('kn-on',!!o.flash);
  S.dark.classList.toggle('kn-on',!!o.dark);S.dark.setAttribute('opacity',o.dark||0);
  S.gl.forEach(function(g){g.classList.toggle('kn-on',o.glint!==undefined&&+g.dataset.i===o.glint)});
  S.spark.forEach(function(g){g.classList.toggle('kn-on',o.spark!==undefined&&+g.dataset.i===o.spark)});
  S.visor.classList.toggle('kn-on',!!o.dim);
  S.stars.forEach(function(st,i){st.classList.toggle('kn-on',n!==undefined&&((n+i*7)%29)<3)});
}
function knRender(I){
  var S=I.kn,n=S.n,m=S.mode;
  if(m==='ent'&&n>=ENT.length){m=S.mode='idle';n=S.n=0}
  if(m==='sig'&&n>=SIG.length){m=S.mode='idle';n=S.n=0}
  if(m==='ent')knShow(I,ENT[n][0],ENT[n][1],n);
  else if(m==='sig')knShow(I,SIG[n][0],SIG[n][1],S.t);

var H={
  init:function(I){

var all=[];
function make(root){

  I.q=function(s){return root.querySelector(s)};

  var on=I.vis&&!document.hidden;

  I.anims.forEach(function(a){try{if(on){if(a.playState==='paused')a.play()}else if(a.playState==='running')a.pause()}catch(e){}});

})();
